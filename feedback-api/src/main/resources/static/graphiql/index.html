<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GraphiQL (Launch)</title>
  <!-- Pin versions and remove crossorigin to avoid CORS/404 execution issues -->
  <link rel="stylesheet" href="https://unpkg.com/graphiql@1.4.7/graphiql.min.css" />
  <style>html,body,#graphiql{height:100%;margin:0}</style>
  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/graphiql@1.4.7/graphiql.min.js"></script>
  </head>
  <body>
    <div id="graphiql">Loading GraphiQL…</div>
    <script>
  // Use the Spring Boot app's /graphql endpoint on the same origin.
  // Use globalThis to avoid linter warnings about `window` in non-browser contexts.
  const endpoint = globalThis.location.origin + '/graphql';
      const fetcher = GraphiQL.createFetcher({ url: endpoint });
      ReactDOM.render(
        React.createElement(GraphiQL, { fetcher }),
        document.getElementById('graphiql')
      );
    </script>
  </body>
</html>
